name: Release gate

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: oracle
        uses: JevForge/jev-release-oracle@v0
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        with:
          environment: production
          base_ref: ${{ github.event.before }}
          signals_path: examples/signals.json
          metrics_path: examples/metrics.json
          changelog_path: CHANGELOG.md
          create_check_run: true
          comment_on_github: false
          dry_run: false

      - name: Branch on decision
        run: |
          echo "decision=${{ steps.oracle.outputs.decision }}"
          echo "held=${{ steps.oracle.outputs.held }}"
          echo "summary=${{ steps.oracle.outputs.summary }}"
          echo "recommended=${{ steps.oracle.outputs.recommended_checks }}"
